<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رادار استراتيجية القاع</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10233a;--line:#1d3653;--text:#eef5ff;--muted:#8ea3bb;--green:#36d399;--yellow:#f5c451;--red:#ff6b7a;--blue:#58a6ff;--purple:#9b8cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0%,#102946 0,#07111f 38%,#050c16 100%);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}.app{max-width:1450px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:14px}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#1c78ff,#7657e8);display:grid;place-items:center;font-size:27px;box-shadow:0 12px 35px #1c78ff33}.title{font-size:27px;font-weight:900}.sub{color:var(--muted);margin-top:5px;font-size:13px}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#102139;color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer}.btn:hover{border-color:#3f6f9e;background:#142b47}.btn.primary{background:linear-gradient(135deg,#1769d1,#644fd0);border:0}.time{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{background:linear-gradient(145deg,#0e2035,#0a1728);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 30px #0002}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:29px;font-weight:900;margin-top:7px}.green{color:var(--green)}.yellow{color:var(--yellow)}.blue{color:var(--blue)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px;flex-wrap:wrap}.search{flex:1;min-width:220px;background:#091729;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px 14px;outline:none}.filters{display:flex;gap:7px}.filter{background:#0d1b2e;color:#9db1c7;border:1px solid var(--line);padding:10px 13px;border-radius:10px;cursor:pointer}.filter.active{background:#17365b;color:#fff;border-color:#3e76ad}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stock{background:linear-gradient(160deg,#0d1d31,#091526);border:1px solid var(--line);border-radius:17px;padding:16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.stock:hover{transform:translateY(-3px);border-color:#3e6f9d;box-shadow:0 15px 40px #0005}.stock.ready{border-color:#287a63}.stock.semi{border-color:#765e2d}.stock-head{display:flex;justify-content:space-between;align-items:center}.ticker{font-size:22px;font-weight:900}.price{font-size:21px;font-weight:800}.badge{font-size:11px;padding:5px 9px;border-radius:99px}.b-ready{background:#123b32;color:var(--green)}.b-semi{background:#423518;color:var(--yellow)}.b-watch{background:#123253;color:var(--blue)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{background:#0a1728;border-radius:10px;padding:9px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:4px}.progress{height:6px;background:#14273d;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2579e8,#42d7a0);border-radius:10px}.stock-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:12px}.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:16px}
.page{display:none}.page.active{display:block}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.back{cursor:pointer}.detail-title{font-size:28px;font-weight:900}.detail-sub{color:var(--muted);font-size:13px;margin-top:5px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.hero-card,.section{background:linear-gradient(145deg,#0d1d31,#091526);border:1px solid var(--line);border-radius:17px;padding:18px}.hero-main{display:flex;justify-content:space-between;align-items:center}.bigprice{font-size:40px;font-weight:900}.tagline{margin-top:8px;color:var(--muted)}.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.planbox{padding:12px;background:#0a1728;border:1px solid var(--line);border-radius:12px}.planbox span{color:var(--muted);font-size:11px}.planbox b{display:block;font-size:18px;margin-top:5px}.entry{color:var(--green)}.stop{color:var(--red)}.target{color:#72d5ff}.section{margin-top:14px}.section h3{margin:0 0 13px;font-size:16px}.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.info{background:#0a1728;border-radius:11px;padding:11px}.info span{display:block;color:var(--muted);font-size:11px}.info b{display:block;margin-top:5px;font-size:15px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{padding:11px;border-radius:10px;background:#0a1728;border:1px solid var(--line)}.check.ok{border-color:#205c4c}.check.no{border-color:#303d50}.check .mark{font-size:17px;margin-left:5px}.resist{display:flex;gap:8px;flex-wrap:wrap}.res{background:#17263a;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.chart{margin-top:14px;background:#071322;border:1px solid var(--line);border-radius:15px;padding:10px;overflow:hidden}.chart svg{width:100%;height:360px;display:block}.note{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.8}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{padding:12px}.top{align-items:flex-start}.title{font-size:21px}.logo{width:44px;height:44px}.time{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.plan{grid-template-columns:1fr 1fr}.info-grid{grid-template-columns:1fr 1fr}.checks{grid-template-columns:1fr}.bigprice{font-size:32px}.chart svg{height:280px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><div class="logo">📡</div><div><div class="title">رادار استراتيجية القاع</div><div class="sub">اكتشاف الصعود → متابعة 20 جلسة → العودة للدعم → تأكيد التعافي → خطة الدخول</div></div></div>
<div class="actions"><span class="time" id="time">آخر تحديث: —</span><button class="btn primary" onclick="loadData()">↻ تحديث</button></div>
</header>

<div id="listPage" class="page active">
<div class="cards">
<div class="stat"><div class="label">جاهز للدخول</div><div class="num green" id="ready">0</div></div>
<div class="stat"><div class="label">شبه جاهز</div><div class="num yellow" id="semi">0</div></div>
<div class="stat"><div class="label">قيد المراقبة</div><div class="num blue" id="watch">0</div></div>
<div class="stat"><div class="label">إجمالي الفرص</div><div class="num" id="all">0</div></div>
<div class="stat"><div class="label">نطاق السعر</div><div class="num">$1–$5</div></div>
</div>
<div class="toolbar">
<input class="search" id="search" placeholder="🔎 ابحث باسم السهم..." oninput="render()">
<div class="filters">
<button class="filter active" data-filter="الكل" onclick="setFilter(this)">الكل</button>
<button class="filter" data-filter="جاهز للدخول" onclick="setFilter(this)">جاهز</button>
<button class="filter" data-filter="شبه جاهز" onclick="setFilter(this)">شبه جاهز</button>
<button class="filter" data-filter="قيد المراقبة" onclick="setFilter(this)">مراقبة</button>
</div>
</div>
<div id="grid" class="grid"></div>
</div>

<div id="detailPage" class="page">
<div class="detail-head"><div><div class="detail-title" id="dt"></div><div class="detail-sub" id="dsub"></div></div><button class="btn back" onclick="goHome()">← العودة للرادار</button></div>
<div id="detailBody"></div>
</div>
</div>

<script>
let D={signals:[]},currentFilter='الكل';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'$'+Number(v||0).toFixed(2);
const yn=v=>v?'نعم':'لا';
function statusClass(s){return s==='جاهز للدخول'?'ready':s==='شبه جاهز'?'semi':'watch'}
function badge(s){return s==='جاهز للدخول'?'b-ready':s==='شبه جاهز'?'b-semi':'b-watch'}
async function loadData(){
 try{const r=await fetch('data.json?x='+Date.now());D=await r.json();document.getElementById('time').textContent='آخر تحديث: '+(D.updated_at?new Date(D.updated_at).toLocaleString('ar-SA'):'—');render();route();}
 catch(e){document.getElementById('time').textContent='تعذر تحميل البيانات';}
}
function setFilter(el){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');currentFilter=el.dataset.filter;render()}
function filtered(){const q=document.getElementById('search').value.trim().toUpperCase();return (D.signals||[]).filter(x=>(currentFilter==='الكل'||x.status===currentFilter)&&x.ticker.toUpperCase().includes(q))}
function render(){
 const s=D.signals||[];document.getElementById('ready').textContent=D.stats?.ready??s.filter(x=>x.status==='جاهز للدخول').length;document.getElementById('semi').textContent=D.stats?.semi_ready??s.filter(x=>x.status==='شبه جاهز').length;document.getElementById('watch').textContent=D.stats?.watching??s.filter(x=>x.status==='قيد المراقبة').length;document.getElementById('all').textContent=s.length;
 const a=filtered();
 document.getElementById('grid').innerHTML=a.length?a.map(x=>{
  const t=x.technical||{}, conf=Math.min(100,Math.round((Number(t.positive_confirmations||0)/5)*100));
  return '<article class="stock '+statusClass(x.status)+'" onclick="openStock(\''+esc(x.ticker)+'\',\''+esc(x.event_date)+'\')">'+
  '<div class="stock-head"><div><div class="ticker">'+esc(x.ticker)+'</div><span class="badge '+badge(x.status)+'">'+esc(x.status)+'</span></div><div class="price">'+money(x.price)+'</div></div>'+
  '<div class="metrics"><div class="metric"><span>RSI</span><b>'+esc(t.rsi)+'</b></div><div class="metric"><span>الدعم</span><b>'+money(x.prior_base)+'</b></div><div class="metric"><span>جلسة المتابعة</span><b>'+esc(x.watch_age)+' / 20</b></div></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>تأكيدات التعافي</span><b>'+esc(t.positive_confirmations||0)+'/5</b></div><div class="progress"><i style="width:'+conf+'%"></i></div>'+
  '<div class="stock-foot"><span>الصعود السابق +'+esc(x.prior_rally_pct)+'%</span><span>فتح التحليل ←</span></div></article>'
 }).join(''):'<div class="empty" style="grid-column:1/-1">لا توجد أسهم مطابقة للفلتر الحالي.</div>';
}
function findStock(ticker,date){return (D.signals||[]).find(x=>x.ticker===ticker&&x.event_date===date)|| (D.signals||[]).find(x=>x.ticker===ticker)}
function openStock(ticker,date){location.hash='stock='+encodeURIComponent(ticker)+'&date='+encodeURIComponent(date);showStock(ticker,date)}
function route(){const h=location.hash;if(h.startsWith('#stock=')){const p=new URLSearchParams(h.slice(1));showStock(p.get('stock'),p.get('date'))}else goHome(false)}
window.addEventListener('hashchange',route);
function goHome(change=true){if(change)history.pushState({},'',location.pathname+location.search);document.getElementById('listPage').classList.add('active');document.getElementById('detailPage').classList.remove('active');window.scrollTo(0,0)}
function showStock(ticker,date){
 const x=findStock(ticker,date);if(!x){goHome(false);return} const t=x.technical||{},p=x.plan||{},s=x.support||{};
 document.getElementById('listPage').classList.remove('active');document.getElementById('detailPage').classList.add('active');window.scrollTo(0,0);
 document.getElementById('dt').textContent=esc(x.ticker)+' — صفحة التحليل الكامل';
 document.getElementById('dsub').textContent='حدث الصعود: '+esc(x.event_date)+' · يوم المتابعة '+esc(x.watch_age)+' من 20 · الحالة: '+esc(x.status);
 const checks=[
 ['RSI دخل التشبع البيعي تحت 30 مؤخراً',t.rsi_oversold_recent],
 ['RSI تعافى فوق 30 ويتحسن',t.rsi_recovery],
 ['MACD Histogram يتحسن',t.macd_improving],
 ['استعادة EMA20 مع اتجاه صاعد',t.ema20_reclaim&&t.ema20_rising],
 ['السعر فوق EMA50',t.ema50_reclaim],
 ['الحجم يؤكد الحركة ≥ 1.2x',t.volume_confirm]
 ];
 document.getElementById('detailBody').innerHTML=
 '<div class="hero"><div class="hero-card"><div class="hero-main"><div><span class="badge '+badge(x.status)+'">'+esc(x.status)+'</span><div class="bigprice">'+money(x.price)+'</div><div class="tagline">صعود سابق +'+esc(x.prior_rally_pct)+'% ثم متابعة العودة إلى منطقة الدعم</div></div><div style="text-align:left"><div class="muted">القمة السابقة</div><b style="font-size:24px">'+money(x.prior_high)+'</b></div></div>'+
 '<div class="plan"><div class="planbox"><span>منطقة الدخول</span><b class="entry">'+money(p.entry_low)+' – '+money(p.entry_high)+'</b></div><div class="planbox"><span>وقف الخسارة</span><b class="stop">'+money(p.stop)+'</b></div><div class="planbox"><span>هدف 100%</span><b class="target">'+money(p.final_100_target)+'</b></div></div></div>'+
 '<div class="hero-card"><h3 style="margin-top:0">ملخص الإشارة</h3><div class="info-grid"><div class="info"><span>الدعم الأصلي</span><b>'+money(x.prior_base)+'</b></div><div class="info"><span>اختبارات الدعم</span><b>'+esc(s.tests)+'</b></div><div class="info"><span>ثبات الدعم</span><b>'+esc(s.stable_sessions)+' جلسات</b></div><div class="info"><span>قريب من الدعم</span><b>'+yn(s.near_support)+'</b></div></div></div></div>'+
 '<div class="section"><h3>📊 المؤشرات الفنية الحالية</h3><div class="info-grid"><div class="info"><span>RSI</span><b>'+esc(t.rsi)+'</b></div><div class="info"><span>RSI السابق</span><b>'+esc(t.rsi_prev)+'</b></div><div class="info"><span>EMA 20</span><b>'+money(t.ema20)+'</b></div><div class="info"><span>EMA 50</span><b>'+money(t.ema50)+'</b></div><div class="info"><span>MACD Histogram</span><b>'+esc(t.macd_hist)+'</b></div><div class="info"><span>نسبة الحجم/20</span><b>'+esc(t.volume_ratio)+'x</b></div><div class="info"><span>تأكيدات إيجابية</span><b>'+esc(t.positive_confirmations)+'/5</b></div><div class="info"><span>أعلى صعود سابق</span><b>+'+esc(x.surge_pct)+'%</b></div></div></div>'+
 '<div class="section"><h3>✅ فحص شروط التعافي</h3><div class="checks">'+checks.map(c=>'<div class="check '+(c[1]?'ok':'no')+'"><span class="mark">'+(c[1]?'✓':'○')+'</span>'+c[0]+'</div>').join('')+'</div></div>'+
 '<div class="section"><h3>🎯 الأهداف والمقاومات المرحلية</h3><div class="resist">'+((p.targets||[]).length?(p.targets||[]).map((v,i)=>'<div class="res">هدف '+(i+1)+' · '+money(v)+'</div>').join(''):'<div class="muted">لا توجد مقاومات مرحلية كافية حالياً</div>')+'<div class="res" style="border-color:#2b8d70">الهدف النهائي 100% · '+money(p.final_100_target)+'</div></div></div>'+
 '<div class="chart" id="chart"></div><div class="note">هذه الصفحة تعرض تحليل السهم بناءً على قواعد الرادار: صعود سابق ≥100%، متابعة من اليوم 2 حتى 20، العودة للدعم، ثم تأكيدات RSI وMACD والمتوسطات والحجم. الخطة الفنية ليست ضماناً للنتيجة.</div>';
 drawChart(x);
}
function drawChart(x){
 const data=x.chart||[];const el=document.getElementById('chart');if(!data.length){el.innerHTML='<div class="muted">لا توجد بيانات للرسم.</div>';return}
 const W=1200,H=380,L=62,R=22,T=25,B=45;const hi=data.map(d=>d.high),lo=data.map(d=>d.low);const min=Math.min(...lo,x.plan?.stop||0)*.98,max=Math.max(...hi,x.prior_high||0)*1.02;const sx=i=>L+i*(W-L-R)/Math.max(1,data.length-1),sy=v=>T+(max-v)*(H-T-B)/(max-min);
 let svg='<svg viewBox="0 0 '+W+' '+H" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b8df8" stop-opacity=".22"/><stop offset="1" stop-color="#4b8df8" stop-opacity="0"/></linearGradient></defs>';
 for(let k=0;k<5;k++){let y=T+k*(H-T-B)/4,v=max-k*(max-min)/4;svg+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#18304a"/><text x="'+(L-9)+'" y="'+(y+4)+'" text-anchor="end" fill="#7890aa" font-size="11">'+v.toFixed(2)+'</text>'}
 const line=data.map((d,i)=>sx(i)+','+sy(d.close)).join(' ');svg+='<polyline points="'+line+'" fill="none" stroke="#58a6ff" stroke-width="3"/>';
 const base=sy(x.prior_base),stop=sy(x.plan.stop),target=sy(x.prior_high);
 [['#f5c451',base,'الدعم'],['#ff6b7a',stop,'الوقف'],['#36d399',target,'هدف 100%']].forEach(a=>{svg+='<line x1="'+L+'" y1="'+a[1]+'" x2="'+(W-R)+'" y2="'+a[1]+'" stroke="'+a[0]+'" stroke-width="1.5" stroke-dasharray="8 6"/><text x="'+(W-R-4)+'" y="'+(a[1]-6)+'" text-anchor="end" fill="'+a[0]+'" font-size="12">'+a[2]+'</text>'});
 data.forEach((d,i)=>{const xx=sx(i),yo=sy(d.open),yc=sy(d.close),yh=sy(d.high),yl=sy(d.low),c=d.close>=d.open?'#36d399':'#ff6b7a';svg+='<line x1="'+xx+'" y1="'+yh+'" x2="'+xx+'" y2="'+yl+'" stroke="#7890aa"/><line x1="'+xx+'" y1="'+yo+'" x2="'+xx+'" y2="'+yc+'" stroke="'+c+'" stroke-width="5" stroke-linecap="round"/>'});
 svg+='<text x="'+L+'" y="'+(H-12)+'" fill="#7890aa" font-size="11">'+data[0].date+'</text><text x="'+(W-R)+'" y="'+(H-12)+'" text-anchor="end" fill="#7890aa" font-size="11">'+data[data.length-1].date+'</text></svg>';
 el.innerHTML='<div style="padding:5px 4px 10px;font-weight:800">📈 حركة السهم — آخر 30 جلسة</div>'+svg;
}
loadData();
</script>
</body></html>
