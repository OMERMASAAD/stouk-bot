name: Stock Radar
on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Commit dashboard data
        run: |
          git config user.name "stock-radar"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "تحديث بيانات الرادار"
          git push
