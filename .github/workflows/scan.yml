name: Stock Scanner

on:
  schedule:
    - cron: "*/15 8-20 * * 1-5"

  workflow_dispatch:

concurrency:
  group: stock-scanner
  cancel-in-progress: true

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تشغيل Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy

      - name: تشغيل الماسح
        run: |
          echo "========================================"
          echo "       تشغيل PULLBACK RECOVERY RADAR"
          echo "========================================"
          python -u bot.py

        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
