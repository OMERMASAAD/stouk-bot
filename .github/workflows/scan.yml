name: Stock Scanner

on:
  schedule:
    - cron: "*/15 8-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: stock-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy

      - name: التأكد من الكود
        run: |
          echo "========================================"
          echo "        معلومات التشغيل"
          echo "========================================"

          echo "Commit الحالي:"
          git log -1 --oneline

          echo ""
          echo "حجم bot_final.py:"
          wc -c bot_final.py

          echo ""
          echo "بداية الكود:"
          head -15 bot_final.py

          echo ""
          echo "البحث عن رسالة الفحص:"
          grep -n "فحص اصطياد القاع الأصلي" bot_final.py || true

      - name: تشغيل البوت الجديد
        run: |
          echo "========================================"
          echo "        تشغيل PULLBACK RECOVERY RADAR"
          echo "========================================"

          python -u bot_final.py

        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
