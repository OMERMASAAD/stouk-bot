name: Stock Radar
on:
  workflow_dispatch:
  push:
    paths:
      - "strategy.py"
      - "scanner.py"
  schedule:
    # فحص 4 مرات في أيام التداول + حفظ قائمة المتابعة.
    - cron: "0 12 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "0 20 * * 1-5"
    - cron: "0 0 * * 2-6"
concurrency:
  group: stock-radar-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Commit dashboard data
        run: |
          git config user.name "stock-radar"
          git config user.email "actions@github.com"
          git add data.json watchlist.json
          git diff --cached --quiet || git commit -m "تحديث بيانات الرادار"
          git push
