name: Deploy Dashboard
on:
  workflow_dispatch:
  push:
    branches:
      - main
  # دفعات المسح تستخدم GITHUB_TOKEN ولا تُفعّل push workflows، لذلك ننشر بعد انتهاء المسح مباشرة
  workflow_run:
    workflows: ["Stock Radar"]
    types: [completed]
  # ونشر احتياطي دوري بعد إغلاق السوق
  schedule:
    - cron: "30 21 * * 1-5"

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
