name: Intraday Panic Scan
on:
  workflow_dispatch:
  schedule:
    # مسح واحد كل 15 دقيقة خلال ما قبل الافتتاح + الجلسة (4:00–17:45 بتوقيت نيويورك).
    # لا نستخدم حلقة sleep داخل الوظيفة: الوظائف الطويلة (~50 د) كانت تمنع GitHub
    # من إطلاق الجدولة التالية، فيتوقف الجدول من الصباح حتى ساعات.
    - cron: "*/15 8-21 * * 1-5"
  workflow_run:
    workflows: ["Stock Radar"]
    types: [completed]
concurrency:
  group: intraday-panic-scan
  cancel-in-progress: true

jobs:
  panic:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Panic scan
        run: |
          git config user.name "stock-radar"
          git config user.email "actions@github.com"
          python panic_scanner.py
          git add panic_data.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "⚡ تحديث قنص الذعر"
          for j in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 3
          done
          exit 1
