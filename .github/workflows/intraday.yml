name: Intraday Panic Scan
on:
  workflow_dispatch:
  schedule:
    # كل 15 دقيقة، أيام التداول، 08:00–23:59 UTC = من Pre-Market (4:00 ET) حتى After-Hours (حتى ~19:45 ET صيفًا)
    # ملاحظة: 14-21 فقط تفوّت أول 30 دقيقة من الافتتاح (13:30 UTC صيفًا) وكل الـ Pre/After.
    - cron: "*/15 8-23 * * 1-5"
concurrency:
  group: intraday-panic-scan
  cancel-in-progress: true          # إذا تأخر تشغيل يُلغى القديم ويكمل الأحدث

jobs:
  panic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Panic scan (5m)
        run: python panic_scanner.py
      - name: Commit panic data
        run: |
          git config user.name "stock-radar"
          git config user.email "actions@github.com"
          git add panic_data.json
          git diff --cached --quiet && exit 0
          git commit -m "⚡ تحديث قنص الذعر"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 3
          done
          exit 1
